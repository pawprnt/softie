[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blush"
version = "0.1.0"
description = "A kawaii self-care desktop companion: water/stretch/affirmation reminders with a pastel tray app."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
blush = "blush.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blush = ["assets/*"]
